name: Build Look4Sat APK

# Manually build a signed release-variant APK from the selected commit:
#   mode=artifact -> upload an Actions artifact only (no tag, prerelease, or Release).
#   mode=test     -> publish a test prerelease, hidden from /releases/latest.
#   mode=release  -> publish the official GitHub Release (v<version>).
#
# Installed Hermes build has versionCode 608; diagnostic workflow runs #4-9
# did not build usable APKs. The first preview build (#10) is versionCode 609.
# Later workflow runs use 599+github.run_number (e.g. #11 -> 610).
# Test builds and official releases share the same versionCode sequence. Test APKs add ".test.<run_number>"
# to versionName; official release tags and versionName still use the version catalog.
# Changes to the version catalog happen only in the runner's checkout, NOT in Git.
# Local Gradle builds keep using the catalog unchanged. Most runs are manual; release commits use a guarded push trigger.
#
# All signed builds are gated by the GitHub Environment named "release".
# Put KEY_STORE, KEY_STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in that
# environment, require a trusted reviewer, and remove repository-level copies.
# The Gradle build itself never receives signing secrets; signing is isolated
# in a later step after the APK has been built.

on:
  # A commit prefixed with "release: v4.4.8-ba7opf." publishes that version on push.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "artifact = Actions download only, test = prerelease, release = official Release"
        type: choice
        options:
          - artifact
          - test
          - release
        default: artifact
      notes:
        description: "Release notes (mode=release only; empty = generated default)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: look4sat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v4.4.8-ba7opf.')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk_version: ${{ steps.version.outputs.apk_version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      unsigned_artifact: ${{ steps.version.outputs.unsigned_artifact }}
    steps:
      - name: Checkout the exact commit of the chosen branch
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" --single-branch https://github.com/atsunatsu/Look4Sat.git source
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Stamp the CI APK version (runner only, no Git changes)
        id: version
        working-directory: source
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BUILD_MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^appVersionName *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)"
          SOURCE_CODE="$(sed -nE 's/^appVersionCode *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)"
          test -n "$VERSION"
          [[ "$SOURCE_CODE" =~ ^[0-9]+$ ]]
          [[ "$BUILD_RUN_NUMBER" =~ ^[0-9]+$ ]]
          # Diagnostic runs #4-9 did not produce usable APKs. Run #10 starts at 609.
          # GitHub re-runs retain their original number.
          CODE=$((599 + BUILD_RUN_NUMBER))
          if (( CODE <= SOURCE_CODE || CODE > 2100000000 )); then
            echo "::error::Generated versionCode $CODE must exceed catalog code $SOURCE_CODE and fit Android's limit."
            exit 1
          fi
          APK_VERSION="$VERSION"
          if [ "$BUILD_MODE" != "release" ]; then
            APK_VERSION="${VERSION}.test.${BUILD_RUN_NUMBER}"
          fi
          # Replace only in this ephemeral CI checkout. Local Gradle keeps the catalog values.
          sed -i -E "s/^appVersionCode *= *\"[^\"]*\"/appVersionCode = \"${CODE}\"/" gradle/libs.versions.toml
          sed -i -E "s/^appVersionName *= *\"[^\"]*\"/appVersionName = \"${APK_VERSION}\"/" gradle/libs.versions.toml
          test "$(sed -nE 's/^appVersionCode *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)" = "$CODE"
          test "$(sed -nE 's/^appVersionName *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)" = "$APK_VERSION"
          {
            echo "version=$VERSION"
            echo "apk_version=$APK_VERSION"
            echo "code=$CODE"
            echo "tag=v$VERSION"
            echo "asset=Look4Sat-$VERSION.apk"
            SHORT_SHA="$(git rev-parse --short=8 HEAD)"
            echo "short_sha=$SHORT_SHA"
            echo "unsigned_artifact=Look4Sat-unsigned-$GITHUB_RUN_ID-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "APK version: $APK_VERSION (versionCode $CODE; catalog versionCode $SOURCE_CODE)"

      - name: Configure Java and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # AGP 9.4.1's default NDK. Without it AGP cannot strip the packaged .so files and ships
          # them with debug symbols (~2.2 MB larger than the same sources built with the NDK).
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;28.2.13676358"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Run unit tests before official Release
        if: ${{ inputs.mode == 'release' || github.event_name == 'push' }}
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Keep broad suite coverage; the existing feature:settings Robolectric
          # RadioConfigurationSaveTest has three unrelated 17-minute timeout
          # failures in GitHub Actions (run 40731086794). Exclude only that
          # problematic class for this release and test all other modules.
          cat > /tmp/look4sat-release-tests.gradle <<'GRADLE_INIT'
          gradle.projectsEvaluated {
              // Init scripts also run in the included build-logic composite build,
              // where the app's :feature:settings project does not exist.
              def settingProject = gradle.rootProject.findProject(':feature:settings')
              if (settingProject != null) {
                  def settingTests = settingProject.tasks.findByName('testDebugUnitTest')
                  if (settingTests != null) {
                      settingTests.filter.excludeTestsMatching('*.RadioConfigurationSaveTest')
                  }
              }
          }
          GRADLE_INIT
          ./gradlew --no-daemon --continue --stacktrace -I /tmp/look4sat-release-tests.gradle test

      - name: Build the unsigned release APK (no signing secrets)
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease --stacktrace
          APK_DIR="app/build/outputs/apk/release"
          APK_INPUT="$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print -quit)"
          if [ -z "$APK_INPUT" ]; then
            echo "::error::Gradle did not produce a release APK."
            exit 1
          fi
          echo "Unsigned release APK ready: $APK_INPUT"

      - name: Locate the unsigned release APK
        id: unsigned
        working-directory: source
        run: |
          set -euo pipefail
          APK_INPUT="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"
          if [ -z "$APK_INPUT" ]; then
            echo "::error::Unsigned release APK was not found."
            exit 1
          fi
          echo "path=source/$APK_INPUT" >> "$GITHUB_OUTPUT"

      - name: Install local artifact client
        run: npm install --prefix source/.github/actions/local-artifact --no-save --no-audit --no-fund @actions/artifact@2.3.2

      - name: Upload unsigned APK for isolated signing
        uses: ./source/.github/actions/local-artifact
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.unsigned_artifact }}
          ARTIFACT_PATH: ${{ steps.unsigned.outputs.path }}
          ARTIFACT_RETENTION_DAYS: 7

  sign-and-publish:
    name: Approve, sign and publish
    needs: build
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v4.4.8-ba7opf.')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    environment:
      name: release
    steps:
      - name: Verify the protected release environment is configured
        env:
          RELEASE_GUARD_ENABLED: ${{ vars.RELEASE_GUARD_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_GUARD_ENABLED" != "true" ]; then
            echo "::error::Create the protected 'release' environment, set RELEASE_GUARD_ENABLED=true, and move signing secrets into it before running signed builds."
            exit 1
          fi

      - name: Checkout the exact source commit
        run: |
          set -euo pipefail
          mkdir source
          git -C source init
          git -C source remote add origin https://github.com/atsunatsu/Look4Sat.git
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download unsigned APK from the build job
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.unsigned_artifact }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/unsigned"
          APK_INPUT="$(find "$RUNNER_TEMP/unsigned" -type f -name "*.apk" -print -quit)"
          if [ -z "$APK_INPUT" ]; then
            echo "::error::Could not download the unsigned APK from the build job."
            exit 1
          fi
          echo "UNSIGNED_APK=$APK_INPUT" >> "$GITHUB_ENV"

      - name: Install Android Build Tools for signing
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;37.0.0"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"

      - name: Sign APK in an isolated step
        id: sign
        env:
          KEY_STORE_B64: ${{ secrets.KEY_STORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEY_STORE_B64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Release environment signing secrets are missing."
              exit 1
            fi
          done

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          KEYSTORE_PATH="$RUNNER_TEMP/look4sat-release.jks"
          ALIGNED_APK="$RUNNER_TEMP/look4sat-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/look4sat-signed.apk"
          cleanup() {
            rm -f "$KEYSTORE_PATH" "$ALIGNED_APK"
          }
          trap cleanup EXIT

          printf '%s' "$KEY_STORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Check the APK version and signing certificate
        working-directory: source
        env:
          SIGNED_APK: ${{ steps.sign.outputs.signed_apk }}
          EXPECTED_APK_VERSION: ${{ needs.build.outputs.apk_version }}
          EXPECTED_VERSION_CODE: ${{ needs.build.outputs.code }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          SIGNER="$BUILD_TOOLS/apksigner"
          APK="$SIGNED_APK"
          test -x "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          # The fork's release key: an APK signed with anything else cannot be installed over an
          # existing installation, so this must fail here rather than ship.
          EXPECTED_CERT="25c064681f79a8ecbc2138fcef3438e7cb5f7bee7087c5fcbc01dca5a3fb6c3a"
          # build-tools 37 renamed this label ("Signer #1 ..." -> "V2 Signer: ..."): match the
          # stable tail of the line, not the prefix.
          CERT="$("$SIGNER" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest:' \
            | head -n 1 | sed -E 's/^.*certificate SHA-256 digest: *//' | tr -d '\r' || true)"
          echo "apk cert: $CERT"
          echo "expected: $EXPECTED_CERT"
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Signing certificate does not match the fork release key."
            exit 1
          fi
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package:|^native-code:"
          echo "$BADGING" | grep -Fq "'armeabi-v7a'" || { echo "::error::Missing armeabi-v7a ABI"; exit 1; }
          echo "$BADGING" | grep -Fq "'arm64-v8a'" || { echo "::error::Missing arm64-v8a ABI"; exit 1; }
          echo "$BADGING" | grep -Fq "versionName='$EXPECTED_APK_VERSION'" \
            || { echo "::error::APK versionName does not match the CI-stamped version."; exit 1; }
          echo "$BADGING" | grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" \
            || { echo "::error::APK versionCode does not match the CI-stamped version."; exit 1; }
          echo "apk bytes: $(stat -c%s "$APK")"

      # The repo's GitHub Actions policy rejects marketplace action refs at startup.
      # This local JavaScript action uses GitHub's own artifact toolkit and receives
      # the runtime artifact token from the runner, without publishing a Release.
      - name: Install local artifact client
        if: ${{ inputs.mode == 'artifact' }}
        run: npm install --prefix source/.github/actions/local-artifact --no-save --no-audit --no-fund @actions/artifact@2.3.2

      - name: Upload signed test APK without creating any Release
        if: ${{ inputs.mode == 'artifact' }}
        uses: ./source/.github/actions/local-artifact
        env:
          ARTIFACT_NAME: Look4Sat-test-${{ needs.build.outputs.code }}-${{ needs.build.outputs.short_sha }}
          ARTIFACT_PATH: ${{ steps.sign.outputs.signed_apk }}
          ARTIFACT_RETENTION_DAYS: 7

      - name: Publish as a prerelease test package
        if: ${{ inputs.mode == 'test' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          ASSET: ${{ needs.build.outputs.asset }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          SIGNED_APK: ${{ steps.sign.outputs.signed_apk }}
        run: |
          set -euo pipefail
          TAG="test-${VERSION}-${SHORT_SHA}"
          cp "$SIGNED_APK" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --prerelease \
              --title "TEST ONLY - Look4Sat $VERSION ($SHORT_SHA)" \
              --notes "Test package built from $VERSION. Prerelease on purpose: the in-app update check ignores prereleases, so it can never be offered to users as an update. Signed with the fork release key."
          fi
          echo "Published prerelease $TAG"

      - name: Publish the official Release
        if: ${{ inputs.mode == 'release' || github.event_name == 'push' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
          NOTES_IN: "${{ inputs.notes }}"
          SIGNED_APK: ${{ steps.sign.outputs.signed_apk }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Official Releases may only be published from main."
            exit 1
          fi
          # Republishing the same version is destructive: only a deliberately
          # labeled push release commit for that version may replace the public asset.
          REPUBLISH=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            COMMIT_SUBJECT="$(git log -1 --format=%s)"
            if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$COMMIT_SUBJECT" != "release: v${VERSION} [republish]" ]; then
              echo "::error::Release $TAG already exists. Explicit [republish] commit required."
              exit 1
            fi
            REPUBLISH=true
          fi
          # The asset must carry the versioned name: the in-app updater guesses
          # Look4Sat-<tag without v>.apk, and gh's `file#label` only sets a display label,
          # never the asset name.
          cp "$SIGNED_APK" "$ASSET"
          NOTES="$NOTES_IN"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            NOTES="$(cat <<'RELEASE_NOTES'
          ## v21.4 — Grid activity Most Wanted colour bands
          - Replace the continuously interpolated grid activity heatmap with seven fixed percentage bands inspired by Gridmaster SAT / LEO maps: 0–2 deep red, 3–7 red-orange, 8–12 orange, 13–17 yellow, 18–22 yellow-green, 23–32 bright green, 33–100 dark green.
          - Keep SAT / LEO / MEO / GEO / NGS palette boundaries consistent and independent of dataset maximum and filter range; filtering only changes visible grids.
          - Use the same seven-band colours for activity percentages in grid details and range-slider endpoint labels.
          - Preserve map transparency and existing worked/marked grid colours; add unit coverage for the colour thresholds.
          - Gridmaster band thresholds and colours are estimated from screenshots rather than verified upstream implementation.

          ## v21.4 — 网格活跃度分档填色
          - 将网格活跃度的连续渐变替换为参考 Gridmaster SAT/LEO 截图估算的七档固定填色：0–2% 深红、3–7% 橘红、8–12% 橙、13–17% 黄、18–22% 黄绿、23–32% 亮绿、33–100% 深绿。
          - SAT、LEO、MEO、GEO 和 NGS 统一采用固定百分比色阶；筛选范围只控制网格可见性，不再改变颜色对应关系。
          - 网格详情的活跃度颜色和范围滑块端点文字颜色同步更新。
          - 保留原有地图透明度和已通联/已标记网格颜色，并为各颜色阈值补充单元测试。
          - 色阶边界及色值来自截图推断，暂未核实 Gridmaster 上游实现。
          RELEASE_NOTES
          )"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Look4Sat $VERSION (versionCode $CODE). Signed with the fork release key; installs over the previous release."
          fi

          CHECKSUM="$ASSET.sha256"
          BUILD_INFO="$ASSET.build-info.txt"
          SHA256="$(sha256sum "$ASSET" | awk '{print $1}')"
          sha256sum "$ASSET" > "$CHECKSUM"
          cat > "$BUILD_INFO" <<BUILD_METADATA
          repository=$GITHUB_REPOSITORY
          commit=$GITHUB_SHA
          ref=$GITHUB_REF
          workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          version=$VERSION
          version_code=$CODE
          apk=$ASSET
          sha256=$SHA256
          BUILD_METADATA

          if [ "$REPUBLISH" = true ]; then
            OLD_NOTES="$(gh release view "$TAG" --json body --jq '.body')"
            AMENDMENT="$(cat <<'REVISION_NOTES'
          ## 18.7 修订版 / Revised 18.7 (2026-11-01)
          - 修复过境列表被空模式筛选误清空、雷达最高仰角小数异常及多余的虚实线文字说明。
          - 修复跟踪中雷达页过境丢失、异步预测旧结果覆盖新结果、TLE 更新丢失尚未保存的卫星勾选状态。
          - 修复双站网格编辑清空精确坐标、距离方位不一致；恢复平滑仰角曲线并保留虚实线门限效果。
          - 转发器源部分下载失败时保留已缓存的有效数据。
          - Same package ID, release-signing certificate and versionName; higher Android versionCode allows installation over the original 18.7 APK.
          - If already on 18.7, download and install this revised APK manually; same-name in-app update checks may not prompt.
          REVISION_NOTES
          )"
            # Replace the single published asset only after all tests, signature,
            # versionCode, and both ARM ABIs have passed.
            gh release upload "$TAG" "$ASSET" "$CHECKSUM" "$BUILD_INFO" --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" --title "Look4Sat $TAG" --latest \
              --notes "$(printf '%s\n\n%s\n' "$OLD_NOTES" "$AMENDMENT")"
            echo "Explicitly republished $TAG from commit $GITHUB_SHA (versionCode $CODE)"
          else
            gh release create "$TAG" "$ASSET" "$CHECKSUM" "$BUILD_INFO" --target "$GITHUB_SHA" --title "Look4Sat $TAG" \
              --latest --notes "$NOTES"
            echo "Published release $TAG"
          fi
