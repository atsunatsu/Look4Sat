name: Build Look4Sat APK
on:
  push:
    branches:
      - artifact-preview-30f72b6
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the preview branch
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" --single-branch https://github.com/atsunatsu/Look4Sat.git source
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install artifact client for local action
        run: npm install --prefix source/.github/actions/local-artifact --no-save --no-audit --no-fund @actions/artifact@2.3.2
      - name: Prepare sample file
        run: echo "local artifact test" > sample.txt
      - name: Upload sample from a local Node action
        uses: ./source/.github/actions/local-artifact
        env:
          ARTIFACT_NAME: smoke-local-${{ github.run_number }}
          ARTIFACT_PATH: sample.txt
          ARTIFACT_RETENTION_DAYS: 1
