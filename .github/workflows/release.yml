name: release

# Dual-edition release: one tag → one GitHub release carrying both APKs.
#   basic       → Look4Sat-<version>.apk            (frozen 4.4.8 feature set, legacy asset name)
#   jsuenhanced → Look4Sat-<version>-jsuenhanced.apk (FT4 / logbook / CAT / rotator edition)
# Both editions share applicationId, signing key and versionCode, so an in-app
# "switch edition" install is a plain update over the same app identity.
#
# The enhanced edition needs the pinned FT4 native toolchain (Flang/LLVM + Boost),
# whose scripts are Windows-only — hence the two-runner matrix. The basic job also
# builds the AAB used by the (optional) Google Play step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      source_ref:
        description: Optional source ref for an explicitly authorized same-version rebuild
        required: false
        type: string
  push:
    tags:
      - v*

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  LOOK4SAT_RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
  LOOK4SAT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  LOOK4SAT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

jobs:
  basic:
    runs-on: ubuntu-latest
    # Signing secrets live in the `release` environment (not plain repo secrets) so a
    # collaborator with push access cannot read them by editing a workflow.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare release signing
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_STORE_BASE64:-}" ]; then
            echo "::error::KEY_STORE secret is not configured"; exit 1
          fi
          store="$RUNNER_TEMP/look4sat-release.jks"
          printf '%s' "$KEY_STORE_BASE64" | base64 -d > "$store"
          echo "LOOK4SAT_RELEASE_STORE_FILE=$store" >> "$GITHUB_ENV"

      - name: Assemble basic APK and AAB
        run: ./gradlew --no-daemon :app:assembleBasicRelease :app:bundleBasicRelease

      - name: Verify basic artifacts
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/basic/release/app-basic-release.apk"
          test -f "$apk" || { echo "::error::basic APK missing"; exit 1; }
          build_tools=$(ls -d "${ANDROID_HOME}/build-tools/"*/ | sort -V | tail -1)
          "${build_tools}apksigner" verify --verbose "$apk"
          pkg=$("${build_tools}aapt2" dump packagename "$apk" | tr -d '\r\n')
          test "$pkg" = "cn.ba7opf.look4sat" || { echo "::error::unexpected applicationId $pkg"; exit 1; }
          if unzip -l "$apk" | grep -q "liblook4sat_ft4.so"; then
            echo "::error::basic APK must not ship the FT4 native core"; exit 1
          fi
          version="${TAG_NAME#v}"
          mkdir -p dist
          cp "$apk" "dist/Look4Sat-${version}.apk"

      - name: Stage Play bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/bundle/basicRelease/app-basic-release.aab dist/Look4Sat-${TAG_NAME#v}-release.aab

      - name: Upload basic artifacts
        uses: actions/upload-artifact@v5
        with:
          name: basic-apk
          path: dist/*

  enhanced:
    runs-on: windows-2025
    environment: release
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install pinned Android native tools
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkManager)) {
            throw "Android sdkmanager not found: $sdkManager"
          }
          & $sdkManager 'ndk;26.1.10909125' 'cmake;3.22.1'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install pinned Android native tools' }

      - name: Restore pinned FT4 toolchain
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\look4sat-toolchain
          key: ft4-toolchain-windows-x64-v2-${{ hashFiles('core/ft4-native/src/main/cpp/tools/prepare-release-toolchain.ps1', 'core/ft4-native/src/main/cpp/tools/toolchain-common.ps1', 'core/ft4-native/src/main/cpp/tools/apply-flang-arm32-patch.ps1', 'core/ft4-native/src/main/cpp/tools/patches/flang-22.1-arm32-codegen.patch') }}

      - name: Prepare pinned FT4 toolchain
        shell: pwsh
        run: |
          ./core/ft4-native/src/main/cpp/tools/prepare-release-toolchain.ps1 `
            -ToolchainRoot (Join-Path $env:RUNNER_TEMP 'look4sat-toolchain')

      - name: Prepare release signing
        shell: pwsh
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE }}
        run: |
          $required = @(
            'KEY_STORE_BASE64',
            'LOOK4SAT_RELEASE_STORE_PASSWORD',
            'LOOK4SAT_RELEASE_KEY_ALIAS',
            'LOOK4SAT_RELEASE_KEY_PASSWORD'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required release signing secret: $name"
            }
          }
          $storePath = Join-Path $env:RUNNER_TEMP 'look4sat-release.jks'
          [IO.File]::WriteAllBytes($storePath, [Convert]::FromBase64String($env:KEY_STORE_BASE64))
          "LOOK4SAT_RELEASE_STORE_FILE=$storePath" | Out-File `
            -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble jsuenhanced APK
        shell: pwsh
        run: ./gradlew.bat --no-daemon :app:assembleJsuenhancedRelease

      - name: Verify jsuenhanced artifact
        shell: pwsh
        run: |
          $apk = 'app\build\outputs\apk\jsuenhanced\release\app-jsuenhanced-release.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw 'jsuenhanced APK missing' }
          $buildTools = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $buildTools) { throw 'Android Build Tools are unavailable' }
          $apkSigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $aapt2 = Join-Path $buildTools.FullName 'aapt2.exe'
          & $apkSigner verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $packageName = (& $aapt2 dump packagename $apk | Out-String).Trim()
          if ($packageName -ne 'cn.ba7opf.look4sat') {
            throw "Unexpected applicationId: $packageName"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($apk)
          try { $entries = @($archive.Entries | ForEach-Object FullName) } finally { $archive.Dispose() }
          foreach ($abi in @('arm64-v8a', 'armeabi-v7a')) {
            if ("lib/$abi/liblook4sat_ft4.so" -notin $entries) {
              throw "jsuenhanced APK is missing the FT4 core for ABI $abi"
            }
          }
          $version = $env:TAG_NAME -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $apk -Destination "dist\Look4Sat-$version-jsuenhanced.apk" -Force

      - name: Upload jsuenhanced artifact
        uses: actions/upload-artifact@v5
        with:
          name: jsuenhanced-apk
          path: dist/*

      - name: Remove temporary credentials
        if: always()
        shell: pwsh
        run: |
          $store = Join-Path $env:RUNNER_TEMP 'look4sat-release.jks'
          if (Test-Path -LiteralPath $store) { Remove-Item -LiteralPath $store -Force }

  publish:
    needs: [basic, enhanced]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            existing=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
            for asset in dist/*; do
              name=$(basename "$asset")
              if printf '%s\n' "$existing" | grep -qx "$name"; then
                echo "Preserving existing asset: $name"
              else
                gh release upload "$TAG_NAME" "$asset"
              fi
            done
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes --verify-tag
          fi

      - name: Deploy basic bundle to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          set -euo pipefail
          gem install fastlane --no-document
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_account.json"
          fastlane supply \
            --aab dist/Look4Sat-${TAG_NAME#v}-release.aab \
            --json_key "$RUNNER_TEMP/service_account.json" \
            --package_name cn.ba7opf.look4sat \
            --track production \
            --skip_upload_images true \
            --skip_upload_screenshots true
          rm -f "$RUNNER_TEMP/service_account.json"
